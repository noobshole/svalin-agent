[package]
name = "svalin-guard"
description = "A vault for an AI agent's money: the agent can only ask to pay, Svalin's look-alike checks run inside the contract, and the owner's key is protected by two-speed rules."
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/noobshole/svalin-guard"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Without the default `wee_alloc` feature: that allocator is unmaintained (RUSTSEC-2022-0054), and
# Rust's own allocator is used instead.
near-sdk = { version = "=5.30.0", default-features = false }

[dev-dependencies]
near-sdk = { version = "=5.30.0", default-features = false, features = ["unit-testing"] }
serde_json = "1"
# Signs the passkey assertions in the tests; the contract itself uses NEAR's own P-256 check.
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "arithmetic"] }
