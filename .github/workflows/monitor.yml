name: Monitor

# Every hour: the API answers, payments go to our own accounts, the Index is fresh, and the website
# serves its security headers and only its own scripts. A failed run emails the repository owner.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Always the newest 22.x patch, so a Node.js security release applies on the next run.
          check-latest: true
      - run: node .github/scripts/monitor.mjs
        env:
          # The public receiving accounts (testnet for now). Update on the switch to mainnet.
          SVALIN_PAYEES: AzfdbWXPC3BiPJqaeHsGqzZw8NoxYSZkZMob1VNivGBo,svalin-agent.testnet
